version: 2
updates:
  # npm workspaces (root package-lock covers all @airchat/* packages + apps/web)
  #
  # All updates are grouped: every npm update edits the same root
  # package-lock.json, so separate PRs would conflict with each other.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Security updates are a separate class from version updates and are
      # NOT covered by the groups below -- they need their own group with
      # `applies-to: security-updates`, or Dependabot opens one PR per
      # advisory.
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

      # Only minor and patch updates are grouped. A major update arrives as
      # its own PR so a breaking change is reviewed on its own.
      production-dependencies:
        applies-to: version-updates
        dependency-type: production
        update-types: ["minor", "patch"]

      dev-dependencies:
        applies-to: version-updates
        dependency-type: development
        update-types: ["minor", "patch"]

    ignore:
      # TypeScript 7 (the native rewrite) does not ship the compiler API that
      # `next build` requires, so major TypeScript updates are ignored until
      # Next.js supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The project runs on Node 20 and later (README; the Docker image is
      # node:20). Two packages track a newer Node than that:
      #
      # @types/node describes the Node version in its own major number. Types
      # for a newer Node than the oldest one supported let code compile against
      # functions that are missing at run time.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # commander 15 needs Node 22.12 or later, which would stop the CLI and
      # the setup wizard starting on Node 20.
      - dependency-name: commander
        update-types: ["version-update:semver-major"]
      # Revisit both when the minimum Node version is raised.

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Action bumps touch .github/workflows/, which the gh CLI cannot merge
      # without the `workflow` OAuth scope. One grouped PR means hitting that
      # once instead of once per action.
      actions:
        patterns: ["*"]
