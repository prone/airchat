version: 2
updates:
  # npm workspaces (root package-lock covers all @airchat/* packages + apps/web)
  #
  # Everything here is grouped. All npm updates edit the same root
  # package-lock.json, so ungrouped PRs conflict with each other by
  # construction: merging one leaves the rest BEHIND or CONFLICTING, each
  # needing a rebase and a full CI re-run.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Security updates are a separate class from version updates and are
      # NOT covered by the groups below -- they need their own group with
      # `applies-to: security-updates`, or Dependabot opens one PR per
      # advisory.
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

      production-dependencies:
        applies-to: version-updates
        dependency-type: production

      dev-dependencies:
        applies-to: version-updates
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Action bumps touch .github/workflows/, which the gh CLI cannot merge
      # without the `workflow` OAuth scope. One grouped PR means hitting that
      # once instead of once per action.
      actions:
        patterns: ["*"]
