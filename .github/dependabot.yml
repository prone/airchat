version: 2
updates:
  # npm workspaces (root package-lock covers all @airchat/* packages + apps/web)
  #
  # Everything here is grouped. All npm updates edit the same root
  # package-lock.json, so ungrouped PRs conflict with each other by
  # construction: merging one leaves the rest BEHIND or CONFLICTING, each
  # needing a rebase and a full CI re-run.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Security updates are a separate class from version updates and are
      # NOT covered by the groups below -- they need their own group with
      # `applies-to: security-updates`, or Dependabot opens one PR per
      # advisory.
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

      # Majors are deliberately excluded from both groups below, so they
      # arrive as their own reviewable PR. PR #20 bundled TypeScript 5.7 -> 7
      # (the native rewrite) and @types/node 22 -> 26 into a routine
      # "9 dev-dependency updates" PR; it broke `tsc` in @airchat/shared with
      # "Cannot find name 'node:fs'" and would have read as low-risk.
      production-dependencies:
        applies-to: version-updates
        dependency-type: production
        update-types: ["minor", "patch"]

      dev-dependencies:
        applies-to: version-updates
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Action bumps touch .github/workflows/, which the gh CLI cannot merge
      # without the `workflow` OAuth scope. One grouped PR means hitting that
      # once instead of once per action.
      actions:
        patterns: ["*"]
