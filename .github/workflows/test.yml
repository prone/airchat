name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The job only reads the repository.
permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Need the base branch present so the downgrade check can diff
          # package-lock.json against it.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check RLS on all tables
        run: bash scripts/check-rls.sh

      # Fails the PR if package-lock.json moves any dependency to an older
      # version than the base branch has (`npm audit fix --force` can do that).
      - name: Check for dependency downgrades
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          node scripts/check-no-downgrades.mjs "origin/${{ github.base_ref }}"

      - name: Install dependencies
        run: npm ci

      # Builds every package, including the Next.js web app, so a type error
      # or broken build fails the PR. The placeholder Supabase values let the
      # client pages prerender; the build makes no network calls.
      - name: Build all packages
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      # The integration tier (`npm run test:integration`) is not run here: it
      # reads ~/.airchat credentials and talks to a live AirChat server, and a
      # GitHub runner has neither. ./scripts/deploy.sh runs it against the
      # deployed server.
