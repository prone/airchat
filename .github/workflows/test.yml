name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Need the base branch present so the downgrade check can diff
          # package-lock.json against it.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check RLS on all tables
        run: bash scripts/check-rls.sh

      # `npm audit fix --force` can resolve an advisory by moving a dependency
      # backwards (it once proposed next@9.3.3 over a transitive sharp CVE).
      # Fail the PR rather than let a downgrade land as "a dependency change".
      - name: Check for dependency downgrades
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          node scripts/check-no-downgrades.mjs "origin/${{ github.base_ref }}"

      - name: Install dependencies
        run: npm ci

      # Build every package (incl. the Next.js web app) so a type error or
      # broken build fails on PR instead of at deploy time on the NAS.
      # Placeholder public Supabase vars let the client-page prerender construct
      # its browser client; no network calls happen at build time.
      - name: Build all packages
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test
