# CodeQL code scanning. Results appear under the repo's Security tab.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 5 * * 1" # weekly, Mondays 05:30 UTC

jobs:
  analyze:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.6
        with:
          languages: javascript-typescript
          # security-extended, not security-and-quality: the latter adds
          # maintainability and style queries, which produced 152 open alerts
          # and buried the security findings among them. security-extended
          # keeps the deeper security queries (more than the default pack)
          # without the code-quality noise.
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.6

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.6
        with:
          category: "/language:javascript-typescript"
