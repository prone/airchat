# Runs a Cloudflare Tunnel beside the web container.
#
#   docker compose -f docker-compose.yml -f deploy/cloudflared/docker-compose.cloudflared.yml up -d
#
# Needs, in the .env file next to docker-compose.yml:
#   TUNNEL_ID         UUID of the tunnel (from `cloudflared tunnel create`)
#   CLOUDFLARED_UID   numeric uid that owns the credentials file (`id -u`)
#   CLOUDFLARED_GID   numeric gid of that user (`id -g`)
# and two files in deploy/cloudflared/, both gitignored:
#   config.yml        copied from config.yml.example and filled in
#   <TUNNEL_ID>.json  the tunnel credentials; a secret, keep it mode 600

services:
  cloudflared:
    # No release is pinned. Replace `latest` with a version tag you have tested
    # so an upstream release cannot change the tunnel on a container restart.
    # Pinned so a restart cannot pull a release nobody has tried. Raise it
    # deliberately; releases are listed at github.com/cloudflare/cloudflared.
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    # Runs as the owner of the credentials file, so the file can stay mode 600
    # without running the container as root.
    user: "${CLOUDFLARED_UID:?set CLOUDFLARED_UID to the owner of the credentials file}:${CLOUDFLARED_GID:?set CLOUDFLARED_GID}"
    volumes:
      - ./deploy/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./deploy/cloudflared/${TUNNEL_ID:?set TUNNEL_ID to the tunnel UUID}.json:/etc/cloudflared/${TUNNEL_ID}.json:ro
    depends_on:
      - agentchat-web
