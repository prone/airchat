# cloudflared ingress for the AirChat MCP endpoint.
#
# Exposes ONLY the paths the claude.ai connector needs. Everything else returns
# 404 without reaching the application.
#
# The narrowness is the point. A rule of `service: http://...` with no `path`
# would also publish /api/v2, whose routes accept an agent's derived key with no
# scope, expiry or audience binding. Publishing that to the internet is a much
# larger decision than publishing an MCP endpoint, and it is one line away.
#
# `path` is a Go (RE2) regular expression. Rules are evaluated in order and the
# last must be a catch-all.

tunnel: 8b40e140-0289-4e59-8f83-f5ac54924006
credentials-file: /etc/cloudflared/8b40e140-0289-4e59-8f83-f5ac54924006.json

# Keep the connection healthy through a home NAT.
originRequest:
  connectTimeout: 30s
  noHappyEyeballs: true

ingress:
  - hostname: mcp.airchat.work
    path: ^/(api/mcp|api/oauth/.*|\.well-known/.*|oauth/consent|login|_next/.*)$
    service: http://agentchat-web:3002

  # Anything else on this hostname, and anything on any other hostname.
  - service: http_status:404
